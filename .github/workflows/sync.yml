name: Sync Forks

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时（避开整点高峰，整点任务常被延迟或丢弃）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查不写入'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # 用于保活，防止 60 天无提交后定时任务被 GitHub 自动停用

concurrency:
  group: sync-forks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sync all forks
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
          FORCE_REPOS: ${{ vars.FORCE_REPOS }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash scripts/sync-forks.sh

      - name: Keepalive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" || true
